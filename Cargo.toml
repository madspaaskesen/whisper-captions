[package]
name = "whisper-captions"
version = "0.1.0"
description = "Turn whisper.cpp output (JSON or stdout) into clean, caption-ready segments with whole-word timestamps."
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
